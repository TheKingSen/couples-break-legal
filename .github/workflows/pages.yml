name: Publication des pages légales

# GitHub Pages sert ce dépôt depuis la branche gh-pages. Personne n'a besoin
# de le savoir : on ne touche qu'à main, et ce workflow recopie main sur
# gh-pages à chaque push. La mise en ligne suit toute seule.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-legales
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recopier main sur gh-pages
        # gh-pages n'est qu'un miroir de main : on l'écrase sans état d'âme.
        run: git push --force origin HEAD:gh-pages
